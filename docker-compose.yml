# Local orchestration for the Next.js migration app + SQL Server (LCFM-26).
# Copy `.env.example` to `.env`, set MSSQL_SA_PASSWORD, then:
#   docker compose up --build -d
# See docs/docker-local-nextjs.md for clean-start, seed, and troubleshooting.

services:
  web-next:
    image: ${DOCKER_REGISTRY-}eshopwebnext
    build:
      context: ./src/Web.Next
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      CATALOG_CONNECTION_STRING: ${CATALOG_CONNECTION_STRING}
      IDENTITY_CONNECTION_STRING: ${IDENTITY_CONNECTION_STRING}
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - eshop-mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  eshop-mssql-data:
